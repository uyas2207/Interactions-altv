<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .notifications-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }
        
        .persistent-notification {
            background: linear-gradient(135deg, #2980b9, #3498db);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin-bottom: 10px;
            border: 2px solid #3498db;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            min-width: 300px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .persistent-notification.show {
            opacity: 1;
        }
        
        .notification-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffcc00;
        }
        
        .notification-text {
            font-size: 16px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        /* Стили для прогресс-бара */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff9900);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s ease;
        }
        
        .progress-text {
            font-size: 14px;
            color: #ffcc00;
            margin-top: 5px;
        }
        
        /* Стили для счетчика нажатий */
        .tap-counter {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            margin: 10px 0;
        }
        
        .tap-feedback {
            animation: pulse 0.3s ease;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        /* Разные типы уведомлений */
        .persistent-notification.progress {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            border-color: #f1c40f;
        }
        
        .persistent-notification.tapCounter {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border-color: #2ecc71;
        }
        
        .persistent-notification.info {
            background: linear-gradient(135deg, #2980b9, #3498db);
            border-color: #3498db;
        }
    </style>
</head>
<body>
    <div id="persistentNotifications" class="notifications-container"></div>

    <script>
        const persistentNotifications = document.getElementById('persistentNotifications');
        let persistentNotificationsMap = new Map();
        
        // Функция для создания постоянного уведомления
        function createPersistentNotification(id, title, text, type = 'info') {
            // Проверяем, не существует ли уже уведомление с таким ID
            if (persistentNotificationsMap.has(id)) {
                console.warn(`Уведомление с ID ${id} уже существует`);
                // Вместо возврата существующего элемента, удаляем его и создаем новый
                hidePersistentNotification(id);
            }
            const notificationElement = document.createElement('div');
            notificationElement.className = `persistent-notification ${type}`;
            notificationElement.dataset.notificationId = id; // Используем data-атрибут вместо id
            notificationElement.innerHTML = `
                <div class="notification-title">${title || 'Уведомление'}</div>
                <div class="notification-text">${text || ''}</div>
                <div class="progress-container" style="display: none;">
                    <div class="progress-bar"></div>
                </div>
                <div class="progress-text" style="display: none;"></div>
                <div class="tap-counter" style="display: none;"></div>
            `;
            
            persistentNotifications.appendChild(notificationElement);
            persistentNotificationsMap.set(id, notificationElement);
            
            // Показываем с анимацией
            setTimeout(() => {
                notificationElement.classList.add('show');
            }, 10);
            
            return notificationElement;
        }
        
        // Функция для скрытия постоянного уведомления
        function hidePersistentNotificationInternal(id) {
            if (persistentNotificationsMap.has(id)) {
                const element = persistentNotificationsMap.get(id);
                element.classList.remove('show');
                
                // Удаляем после анимации
                setTimeout(() => {
                    element.remove();
                    persistentNotificationsMap.delete(id);
                }, 300);
            }
        }
        
        // ========== ПОСТОЯННОГО УВЕДОМЛЕНИЯ ==========
        
        // Показ постоянного уведомления
        window.showPersistentNotification = function(id, title, text) {
        if (persistentNotificationsMap.has(id)) {
            // обновляет существующее уведомление
            const existingElement = persistentNotificationsMap.get(id);
            const titleElement = existingElement.querySelector('.notification-title');
            const textElement = existingElement.querySelector('.notification-text');
            if (titleElement) titleElement.textContent = title || 'Уведомление';
            if (textElement) textElement.textContent = text || '';
            return;
        }
        createPersistentNotification(id, title, text, 'info');
        };
        
        // Скрытие постоянного уведомления
        window.hidePersistentNotification = function(id) {
            hidePersistentNotificationInternal(id);
        };
        
        // ========== ПРОГРЕСС-БАР ==========
        
        window.showProgressBar = function(id, title, initialProgress = 0, text = '') {
            const notificationElement = createPersistentNotification(id, title, text, 'progress');
            
            const progressContainer = notificationElement.querySelector('.progress-container');
            const progressBar = notificationElement.querySelector('.progress-bar');
            const progressText = notificationElement.querySelector('.progress-text');
            
            progressContainer.style.display = 'block';
            progressBar.style.width = (initialProgress * 100) + '%';
            
            if (text) {
                progressText.textContent = text;
                progressText.style.display = 'block';
            }
            
            return id;
        };
        
        window.updateProgressBar = function(id, progress, text = '') {
            if (persistentNotificationsMap.has(id)) {
                const notificationElement = persistentNotificationsMap.get(id);
                const progressBar = notificationElement.querySelector('.progress-bar');
                const progressText = notificationElement.querySelector('.progress-text');
                
                progressBar.style.width = (progress * 100) + '%';
                
                if (text) {
                    progressText.textContent = text;
                    progressText.style.display = 'block';
                }
            }
        };
        
        window.hideProgressBar = function(id) {
            hidePersistentNotification(id);
        };
        
        // ========== СЧЕТЧИК НАЖАТИЙ ==========
        
        window.showTapCounter = function(id, title, currentTaps = 0, requiredTaps = 0, text = '') {
            const notificationElement = createPersistentNotification(id, title, text, 'tapCounter');
            
            const tapCounter = notificationElement.querySelector('.tap-counter');
            const progressText = notificationElement.querySelector('.progress-text');
            
            tapCounter.style.display = 'block';
            tapCounter.textContent = `${currentTaps}/${requiredTaps}`;
            
            if (text) {
                progressText.textContent = text;
                progressText.style.display = 'block';
            }
            
            return id;
        };
        
        window.updateTapCounter = function(id, currentTaps, text = '') {
            if (persistentNotificationsMap.has(id)) {
                const notificationElement = persistentNotificationsMap.get(id);
                const tapCounter = notificationElement.querySelector('.tap-counter');
                const progressText = notificationElement.querySelector('.progress-text');
                
                tapCounter.textContent = `${currentTaps}`;
                tapCounter.classList.add('tap-feedback');
                
                setTimeout(() => {
                    tapCounter.classList.remove('tap-feedback');
                }, 300);
                
                if (text) {
                    progressText.textContent = text;
                }
            }
        };
        
        window.hideTapCounter = function(id) {
            hidePersistentNotification(id);
        };
        
        // Обработка сообщений клиента
        if ('alt' in window) {
            // постоянные уведомления (1 нажатие)
            alt.on('showPersistentNotification', (id, title, text) => {
                showPersistentNotification(id, title, text);
            });
            
            alt.on('hidePersistentNotification', (id) => {
                hidePersistentNotification(id);
            });
            
            // прогресс-бары
            alt.on('showProgressBar', (id, title, initialProgress, text) => {
                showProgressBar(id, title, initialProgress, text);
            });
            
            alt.on('updateProgressBar', (id, progress, text) => {
                updateProgressBar(id, progress, text);
            });
            
            alt.on('hideProgressBar', (id) => {
                hideProgressBar(id);
            });
            
            // счетчики нажатий
            alt.on('showTapCounter', (id, title, currentTaps, requiredTaps, text) => {
                showTapCounter(id, title, currentTaps, requiredTaps, text);
            });
            
            alt.on('updateTapCounter', (id, currentTaps, text) => {
                updateTapCounter(id, currentTaps, text);
            });
            
            alt.on('hideTapCounter', (id) => {
                hideTapCounter(id);
            });
        }
    </script>
</body>
</html>
